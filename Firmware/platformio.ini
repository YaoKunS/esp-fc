  ${env.build_unflags}
build_flags =
  ${env.build_flags}
  -DESP32S2
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts = 
  ${env.extra_scripts}
  bin/pio_merge_firmware.py
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes

[env:esp32c3]
board = esp32-c3-devkitm-1
platform = espressif32
framework = arduino
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
lib_deps =
  ${env.lib_deps}
build_unflags =
  ${env.build_unflags}
build_flags =
  ${env.build_flags}
  -DESP32C3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts = 
  ${env.extra_scripts}
  bin/pio_merge_firmware.py

[env:esp8266]
board = d1_mini
platform = espressif8266
framework = arduino
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.ldscript = eagle.flash.4m3m.ld
;board_build.ldscript = eagle.flash.1m128.ld ; d1_mini_lite
;board_build.ldscript = eagle.flash.16m15m.ld ; d1_mini_pro
lib_deps =
  ${env.lib_deps}
build_unflags =
  ${env.build_unflags}
build_flags =
  ${env.build_flags}

# https://github.com/platformio/platform-raspberrypi/pull/36
[env:rp2040]
board = pico
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
lib_deps =
build_unflags =
  ${env.build_unflags}
build_flags =
  ${env.build_flags}
  -DARCH_RP2040
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
  -DIRAM_ATTR=""

[env:rp2350]
board = rpipico2
;platform = https://github.com/maxgerhardt/platform-raspberrypi.git#rp2350_picosdk
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
lib_deps =
build_unflags =
  ${env.build_unflags}
build_flags =
  ${env.build_flags}
  -DARCH_RP2040
  -DARCH_RP2350
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
  -DIRAM_ATTR=""

; target for unit tests
[env:native]
platform = native
lib_deps =
  fabiobatsilva/ArduinoFake@^0.4.0
  throwtheswitch/Unity@^2.6.0
build_unflags =
  -std=gnu++11
build_flags =
  -std=c++17
  -Wall
  -I.pio/build/native/unity_config
  -DIRAM_ATTR=""
  -DUNIT_TEST
  -DNO_GLOBAL_INSTANCES
  -DF_CPU=160000000UL
;  -DUNITY_INCLUDE_PRINT_FORMATTED
#build_type = debug
#debug_test = test_cli
