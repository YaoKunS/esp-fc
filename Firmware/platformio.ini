; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = esp32, esp32s2, esp32s3, esp32c3, esp8266, rp2040, rp2350

[env]
build_flags =
  -std=gnu++17
  -Wall
;  -DESPFC_DEBUG_SERIAL
;  -DESPFC_DEBUG_PIN=2 ; specify pin number (board specific)
;  -DESPFC_DEV_PRESET_MODES
;  -DESPFC_DEV_PRESET_BLACKBOX_SERIAL=1 ; specify port number (board specific)
;  -DESPFC_DEV_PRESET_BLACKBOX_FLASH
;  -DESPFC_DEV_PRESET_DSHOT
;  -DESPFC_DEV_PRESET_BRUSHED
;  -DESPFC_DEV_PRESET_SCALER
;  -DNO_GLOBAL_INSTANCES
;  -DESPFC_SINGLE_CORE ; force single core build
;  -DESPFC_HAL_QUEUE_ATOMIC ; force atomic event queue
;  -DESPFC_HAL_QUEUE_FREERTOS ; reference FreeRTOS event queue, esp32 only
;  -DESPFC_HAL_QUEUE_PICOSDK ; reference pico-sdk event queue, rp2040/rp2350 only
;  -DDEBUG_ESP_PORT=Serial
;  -DDEBUG_ESP_CORE
;  -DDEBUG_ESP_WIFI
;  -DDEBUG_RP2040_PORT=Serial
;  -DDEBUG_RP2040_SPI
check_tool = cppcheck
; check_tool = clangtidy
check_src_filters =
  +<src/*>
  +<lib/Espfc/src/*>
  +<lib/EscDriver/src/*>
  +<test/*>
extra_scripts = 
  pre:bin/pio_version.py
  bin/pio_format.py
build_unflags =
  -std=gnu++11
  -ggdb

monitor_speed = 115200
upload_speed = 921600
; upload_speed = 460800
monitor_filters = send_on_enter
; monitor_filters = send_on_enter,esp32_exception_decoder
monitor_echo = yes

lib_deps =
  yoursunny/WifiEspNow @ ^0.0.20230713
  https://github.com/rtlopez/espnow-rclink/archive/refs/tags/v0.1.1.zip
;  EspNowRcLink=symlink://../espnow-rclink

[env:esp32]
board = lolin32
platform = espressif32
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions_4M_nota.csv
lib_deps =
  ${env.lib_deps}
build_unflags =
  ${env.build_unflags}
build_flags =
  ${env.build_flags}
extra_scripts = 
  ${env.extra_scripts}
  bin/pio_merge_firmware.py

[env:esp32s3]
board = lolin_s3_mini
platform = espressif32
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions_4M_nota.csv
lib_deps =
  ${env.lib_deps}
build_unflags =
  ${env.build_unflags}
  -DBOARD_HAS_PSRAM
build_flags =
  ${env.build_flags}
  -DESP32S3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts = 
  ${env.extra_scripts}
  bin/pio_merge_firmware.py
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes

; ===========================================================================
; 耀坤 S3 无人机 —— 耀坤智联新增（yaokun-organized）
; ---------------------------------------------------------------------------
; 上面那个 [env:esp32s3] 是上游原版，**一行未改**，保持可随时对比回归。
; 下面这两个 env 才是烧到耀坤 S3 无人机上的固件。
;
; 【必��的两个宏】
;   -DESPFC_TARGET_YAOKUN : 让 Target.h 选 TargetESP32s3YaoKun.h 而不是上游的
;                            TargetESP32s3.h。少了它 → 电机引脚全错（39/40/41/42）、
;                            蜂鸣器被当成电机脚，板子直接不响应。
;   -DESPFC_DEV_PRESET_BRUSHED : 🔴 本板用 8520 **空心杯有刷**电机，
;                            有刷电机只认 PWM，不认 DShot。
;                            这个宏把输出协议强制成 ESC_PROTOCOL_BRUSHED + async + 3kHz。
;                            少了它 → 默认走 DShot300，有刷电调根本收不到 → 四电机全停转。
;
; 【env 选择指南】
;   esp32s3_yaokun       → 立创 ESP32-S3-R8N8（Flash 8MB + OPI PSRAM 8MB）★常用
;   esp32s3_yaokun_n4r2  → ESP32S3 Supermini N4R2（Flash 4MB + QIO PSRAM 2MB）
;   两者引脚定义完全相同，只差Flash 大小 / PSRAM 类型 / 分区表。
;   🔴 用错了的典型症状：N4R2 模组刷了 R8N8 参数 → 分区越界 + OPI 初始化失败，
;      芯片上电直接 panic，无串口输出、地面站搜不到板子（这个坑已经踩过）。
; ===========================================================================

; ---- 立创 ESP32-S3-R8N8（8MB Flash / 8MB OPI PSRAM）★ 默认烧这个 ----
[env:esp32s3_yaokun]
board = esp32-s3-devkitc-1
platform = espressif32
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
; R8N8 是 8MB Flash，必须用 8MB 分区表，否则 app 超出 4MB 分区直接烧不进去
board_build.arduino.partitions = default_8MB.csv
board_upload.flash_size = 8MB
; 🔴 R8N8 的 PSRAM 是 8线OPI，memory_type 必须写 qio_opi。
;    写成 qio（4线）会 PSRAM 探测失败 → 上电 panic。
board_build.arduino.memory_type = qio_opi
lib_deps =
  ${env.lib_deps}
build_unflags =
  ${env.build_unflags}
build_flags =
  ${env.build_flags}
  -DESP32S3
  -DESPFC_TARGET_YAOKUN
  -DESPFC_DEV_PRESET_BRUSHED
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
  ${env.extra_scripts}
  bin/pio_merge_firmware.py
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
monitor_speed = 115200

; ---- ESP32S3 Supermini N4R2（4MB Flash / 2MB QIO PSRAM）----
[env:esp32s3_yaokun_n4r2]
board = esp32-s3-devkitc-1
platform = espressif32
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
; 🔴 N4R2 只有 4MB Flash，single-app 分区表（no OTA），app 上限约 1.3MB
board_build.partitions = partitions_4M_nota.csv
board_upload.flash_size = 4MB
; 🔴 N4R2 的 PSRAM 是 2MB **四线 QIO**，不支持 OPI
board_build.arduino.memory_type = qio
lib_deps =
  ${env.lib_deps}
build_unflags =
  ${env.build_unflags}
build_flags =
  ${env.build_flags}
  -DESP32S3
  -DESPFC_TARGET_YAOKUN
  -DESPFC_DEV_PRESET_BRUSHED
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
  ${env.extra_scripts}
  bin/pio_merge_firmware.py
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
monitor_speed = 115200

[env:esp32s2]
board = esp32-s2-saola-1
platform = espressif32
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions_4M_nota.csv
lib_deps =
  ${env.lib_deps}
